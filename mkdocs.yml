site_name: MEDHIRA JSON UI Engine
site_url: https://medhira-rn-expo-json-ui-engine.readthedocs.io
docs_dir: docs
site_description: A JSON-driven UI engine for React Native and Expo - Engineering Intelligence Across Everything
site_author: MEDHIRA Team

repo_url: https://github.com/HELLOMEDHIRA/medhira-rn-expo-json-ui-engine
repo_name: HELLOMEDHIRA/medhira-rn-expo-json-ui-engine

copyright: "Copyright &copy; 2024 MEDHIRA - Engineering Intelligence Across Everything"

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  logo: https://raw.githubusercontent.com/HELLOMEDHIRA/medhira/main/assets/medhira-logo.png
  favicon: https://raw.githubusercontent.com/HELLOMEDHIRA/medhira/main/assets/medhira-logo.png
  features:
    - navigation.top
    - navigation.tracking
    - navigation.tabs
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md
  - Core Concepts:
      - JSON UI Basics: core-concepts/json-ui-basics.md
      - Component Registry: core-concepts/component-registry.md
      - Dynamic Sources: core-concepts/dynamic-sources.md
      - Conditional Rendering: core-concepts/conditional-rendering.md
  - Components:
      - Containers: components/containers.md
      - Basic Components: components/basic-components.md
      - Third-Party Components: components/third-party-components.md
  - API Reference:
      - JSONUI: api/jsonui.md
      - Component Types: api/component-types.md
  - Examples:
      - Basic Examples: examples/basic-examples.md
      - Advanced Examples: examples/advanced-examples.md
  - About:
      - License: about/license.md
      - Contributing: about/contributing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/HELLOMEDHIRA
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/medhira
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/smuniharish
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/medhira-rn-expo-json-ui-engine
  version: 0.0.1
  release: 0.0.1